; Kit Pedagogique CO2 (EduKit) - PlatformIO Configuration
; ================================================
; Projet pour Raspberry Pi Pico 2 W + SensAir S88 + OLED 0.96"
;
; Commandes utiles:
;   pio run            - Compiler
;   pio run -t upload  - Compiler et uploader
;   pio device monitor - Voir les logs serie

[env:pico]
; Plateforme epinglee sur un COMMIT, comme l'Alba : l'URL nue suit master, qui
; est passe (9c167c6, 2026-08-03) a la toolchain GCC 16, incapable de compiler
; le coeur ci-dessous ("'__getreent' was not declared"). aa70b80 (2026-07-01)
; est le dernier commit sur la toolchain 4.1.0 / GCC 14.
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#aa70b802be8851668053d4f09734e4089fe41932
board = rpipico2w
framework = arduino
board_build.core = earlephilhower
; Ne pas changer : deplacer le systeme de fichiers effacerait le reseau WiFi
; enregistre des EduKit deja configures.
board_build.filesystem_size = 0.5m

; Coeur arduino-pico 5.6.0 : celui de l'Alba, dont la bibliotheque BLE
; (BLE.h, sur BTstack) porte la configuration WiFi Improv (src/ble_improv.cpp).
platform_packages =
    framework-arduinopico@https://github.com/earlephilhower/arduino-pico/releases/download/5.6.0/rp2040-5.6.0.zip

; Upload
upload_protocol = picotool
upload_port = /dev/cu.usbmodem313301

; Vitesse du port série pour le debug
monitor_speed = 115200

; Librairies
lib_deps =
    ; Ecran OLED SSD1306
    thingpulse/ESP8266 and ESP32 OLED driver for SSD1306 displays@^4.4.1

; Flags de compilation
build_flags =
    -DPICO_BUILD=1
    -DPIO_FRAMEWORK_ARDUINO_ENABLE_WIFI
    -DPIO_FRAMEWORK_ARDUINO_ENABLE_BLUETOOTH
